##wordpress-mysql

services:
  db:
    image: mysql:8.4
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: webadmin
      MYSQL_PASSWORD: i4gotpasswd
      MYSQL_ROOT_PASSWORD: sqlr00t
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wordpress-net

  wordpress:
    image: wordpress:fpm-alpine
    container_name: wordpress_web
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: webadmin
      WORDPRESS_DB_PASSWORD: i4gotpasswd
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - db
    networks:
      - wordpress-net

  nginx:
    image: nginx:alpine
    container_name: wordpress_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wordpress
    networks:
      - wordpress-net

volumes:
  mysql_data:
  wordpress_data:

networks:
  wordpress-net:
    external: true

